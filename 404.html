<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>404 — Horizon</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --main-color:   #a1a5a8;
    --accent:       #d4af37;
    --accent-light: #e6c765;
    --accent-dark:  #9c7c20;
    --red:          #bf4040;
    --green:        #40bf40;
    --dark-grey:    #737d8c;

    --text:         #0f172a;
    --text-muted:   #4b5563;
    --glass:        rgba(255, 255, 255, 0.55);
    --glass-border: rgba(255, 255, 255, 0.35);
  }

  [data-theme="dark"] {
    --main-color:   #0a0d13;
    --accent:       #d4af37;
    --accent-light: #e6c765;
    --accent-dark:  #9c7c20;
    --red:          #e61919;
    --green:        #19e619;
    --dark-grey:    #273545;

    --text:         #f0f6fc;
    --text-muted:   #8b949e;
    --glass:        rgba(20, 20, 30, 0.5);
    --glass-border: rgba(255, 255, 255, 0.12);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--main-color);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    transition: background 0.2s ease, color 0.2s ease;
  }

  .card {
    max-width: 460px;
    width: 100%;
    text-align: center;
    padding: 48px 40px;
    border-radius: 28px;
    background: var(--glass);
    backdrop-filter: blur(28px);
    -webkit-backdrop-filter: blur(28px);
    border: 1px solid var(--glass-border);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
  }

  .tag {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 5px 14px;
    border-radius: 999px;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--red);
    border: 1px solid color-mix(in srgb, var(--red) 45%, transparent);
    background: color-mix(in srgb, var(--red) 12%, transparent);
    margin-bottom: 22px;
  }

  .tag .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--red);
  }

  h1 {
    font-size: clamp(2.2rem, 6vw, 3rem);
    font-weight: 800;
    letter-spacing: -0.03em;
    margin-bottom: 12px;
  }

  h1 .code {
    color: var(--accent);
  }

  p {
    font-size: 0.97rem;
    color: var(--text-muted);
    line-height: 1.65;
    margin-bottom: 32px;
  }

  .actions {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
  }

  a.btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 22px;
    border-radius: 12px;
    font-size: 0.88rem;
    font-weight: 600;
    text-decoration: none;
    transition: all 0.2s ease;
  }

  a.btn.primary {
    background: var(--accent);
    color: #0a0d13;
  }
  a.btn.primary:hover {
    background: var(--accent-light);
    transform: translateY(-2px);
  }

  a.btn.ghost {
    background: rgba(255, 255, 255, 0.06);
    color: var(--text);
    border: 1px solid var(--glass-border);
  }
  a.btn.ghost:hover {
    background: rgba(255, 255, 255, 0.1);
    transform: translateY(-2px);
  }

  .theme-toggle {
    position: fixed;
    top: 24px;
    right: 24px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 1px solid var(--glass-border);
    background: var(--glass);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .theme-toggle:hover { color: var(--text); transform: scale(1.08); }
  .theme-toggle svg { width: 18px; height: 18px; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

<button class="theme-toggle" id="themeToggle" aria-label="Toggle theme" title="Toggle theme">
  <svg id="iconSun" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" style="display:none">
    <circle cx="12" cy="12" r="5"/>
    <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
    <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
  </svg>
  <svg id="iconMoon" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
    <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
  </svg>
</button>

<div class="card">
  <span class="tag"><span class="dot"></span> 404</span>
  <h1>Page not <span class="code">found</span></h1>
  <p>Whatever you were looking for isn't here — moved, renamed, or never existed in the first place.</p>
  <div class="actions">
    <a class="btn primary" href="/" onclick="if (window.history.length > 1) { history.back(); return false; }">Take me back</a>
    <a class="btn ghost" href="/">Go home</a>
  </div>
</div>

<script>
  const root = document.documentElement;
  const toggle = document.getElementById('themeToggle');
  const sun = document.getElementById('iconSun');
  const moon = document.getElementById('iconMoon');

  const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const saved = localStorage.getItem('theme') || (systemDark ? 'dark' : 'light');
  applyTheme(saved);

  toggle.addEventListener('click', () => {
    const next = root.dataset.theme === 'dark' ? 'light' : 'dark';
    applyTheme(next);
    localStorage.setItem('theme', next);
  });

  function applyTheme(t) {
    root.dataset.theme = t;
    sun.style.display = t === 'dark' ? 'block' : 'none';
    moon.style.display = t === 'light' ? 'block' : 'none';
  }
</script>

</body>
</html>
