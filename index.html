<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Horizon - QAE</title>
  <meta name="description" content="QA Engineer" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="icon" type="image/png" href="pfp-circle.png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    /* ── TOKENS ─────────────────────────────────────────── */
    :root {
      --text:         #0f172a;
      --text-muted:   #64748b;
      --text-dim:     #94a3b8;
      --accent:       #3b82f6;
      --glass-light:  rgba(255, 255, 255, 0.55);
      --glass-border-light: rgba(255, 255, 255, 0.35);
      --glass-dark:   rgba(20, 20, 30, 0.45);
      --glass-border-dark: rgba(255, 255, 255, 0.15);
      --nav-bg:       rgba(255, 255, 255, 0.7);
      --nav-border:   rgba(255, 255, 255, 0.4);
      --pill-bg:      rgba(255, 255, 255, 0.4);
      --pill-text:    #334155;
    }
    
    [data-theme="dark"] {
      --text:         #f0f6fc;
      --text-muted:   #8b949e;
      --text-dim:     #484f58;
      --accent:       #58a6ff;
      --glass-light:  rgba(20, 20, 30, 0.45);
      --glass-border-light: rgba(255, 255, 255, 0.15);
      --glass-dark:   rgba(20, 20, 30, 0.5);
      --glass-border-dark: rgba(255, 255, 255, 0.12);
      --nav-bg:       rgba(20, 20, 30, 0.6);
      --nav-border:   rgba(255, 255, 255, 0.15);
      --pill-bg:      rgba(255, 255, 255, 0.12);
      --pill-text:    #c9d1d9;
    }

    /* ── RESET ──────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    /* ── VIDEO BACKGROUND ───────────────────────────────── */
    .bg-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -1;
    }
    .bg-image {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -1;
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-image: url('background.png');
      background-attachment: fixed;
      background-size: cover;
      background-position: center;
      background-color: #ffffff;
      color: var(--text);
      line-height: 1.6;
      transition: color 0.2s;
      padding-bottom: 120px;
      min-height: 100vh;
    }

    [data-theme="dark"] body {
      background-color: #0f1117;
    }

    /* ── LAYOUT ─────────────────────────────────────────── */
    .container { max-width: 720px; margin: 0 auto; padding: 16px; }

    /* ── FROSTED GLASS TILE ─────────────────────────────── */
    .glass-tile {
      background: var(--glass-light);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--glass-border-light);
      border-radius: 28px;
      padding: 32px;
      transition: all 0.3s ease;
      box-shadow: 
        0 8px 32px rgba(0, 0, 0, 0.08),
        inset 0 1px 1px rgba(255, 255, 255, 0.6);
    }
    
    .glass-tile:hover {
      background: var(--glass-light);
      box-shadow:
        0 12px 48px rgba(0, 0, 0, 0.12),
        inset 0 1px 1px rgba(255, 255, 255, 0.6);
      transform: translateY(-2px);
    }

    [data-theme="dark"] .glass-tile {
      background: var(--glass-dark);
      border-color: var(--glass-border-dark);
      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.3),
        inset 0 1px 1px rgba(255, 255, 255, 0.08);
    }

    [data-theme="dark"] .glass-tile:hover {
      box-shadow:
        0 12px 48px rgba(0, 0, 0, 0.4),
        inset 0 1px 1px rgba(255, 255, 255, 0.08);
    }

    /* ── KEYFRAMES ──────────────────────────────────────── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes avatarPop {
      0%   { opacity: 0; transform: scale(0.82); }
      65%  { transform: scale(1.05); }
      100% { opacity: 1; transform: scale(1); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50%       { transform: translateY(-6px); }
    }
    @keyframes navSlideUp {
      from { opacity: 0; transform: translateX(-50%) translateY(16px); }
      to   { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    /* ── HERO ANIMATIONS ────────────────────────────────── */
    .hero-text h1 { animation: fadeUp 0.5s ease 0.05s both; }
    .hero-text p  { animation: fadeUp 0.5s ease 0.15s both; }
    .avatar {
      animation: avatarPop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.1s both,
                 float 4s ease-in-out 1s infinite;
    }

    /* ── SCROLL REVEAL ──────────────────────────────────── */
    .reveal {
      opacity: 0;
      transform: translateY(22px);
      transition: opacity 0.55s ease, transform 0.55s ease;
    }
    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .reveal.visible .entry { animation: fadeUp 0.4s ease both; }
    .reveal.visible .entry:nth-child(1) { animation-delay: 0.05s; }
    .reveal.visible .entry:nth-child(2) { animation-delay: 0.10s; }
    .reveal.visible .entry:nth-child(3) { animation-delay: 0.15s; }
    .reveal.visible .entry:nth-child(4) { animation-delay: 0.20s; }
    .reveal.visible .entry:nth-child(5) { animation-delay: 0.25s; }

    .reveal.visible .skill-pill { animation: fadeUp 0.35s ease both; }
    .reveal.visible .skill-pill:nth-child(1) { animation-delay: 0.04s; }
    .reveal.visible .skill-pill:nth-child(2) { animation-delay: 0.08s; }
    .reveal.visible .skill-pill:nth-child(3) { animation-delay: 0.12s; }
    .reveal.visible .skill-pill:nth-child(4) { animation-delay: 0.16s; }
    .reveal.visible .skill-pill:nth-child(5) { animation-delay: 0.20s; }
    .reveal.visible .skill-pill:nth-child(6) { animation-delay: 0.24s; }
    .reveal.visible .skill-pill:nth-child(7) { animation-delay: 0.28s; }
    .reveal.visible .skill-pill:nth-child(8) { animation-delay: 0.32s; }
    .reveal.visible .skill-pill:nth-child(9) { animation-delay: 0.36s; }

    .floating-nav { animation: navSlideUp 0.5s ease 0.35s both; }

    /* ── TAB SWITCHER ───────────────────────────────────── */
    .tab-bar {
      display: flex;
      gap: 8px;
      padding: 20px 0 32px;
    }
    .tab-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      transition: all 0.2s ease;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    [data-theme="dark"] .tab-link {
      background: rgba(255, 255, 255, 0.04);
      border-color: rgba(255, 255, 255, 0.08);
    }

    .tab-link:hover {
      background: rgba(255, 255, 255, 0.12);
      color: var(--text);
      border-color: rgba(255, 255, 255, 0.2);
    }

    [data-theme="dark"] .tab-link:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.15);
    }

    .tab-link.active {
      background: rgba(255, 255, 255, 0.15);
      color: var(--text);
      border-color: rgba(255, 255, 255, 0.25);
    }

    [data-theme="dark"] .tab-link.active {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .tab-link svg { width: 14px; height: 14px; }

    /* ── HERO ───────────────────────────────────────────── */
    .hero {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 32px;
      padding: 56px 32px;
      background: var(--glass-light);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--glass-border-light);
      border-radius: 28px;
      margin-bottom: 32px;
      box-shadow: 
        0 8px 32px rgba(0, 0, 0, 0.08),
        inset 0 1px 1px rgba(255, 255, 255, 0.6);
      transition: all 0.3s ease;
    }

    [data-theme="dark"] .hero {
      background: var(--glass-dark);
      border-color: var(--glass-border-dark);
      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.3),
        inset 0 1px 1px rgba(255, 255, 255, 0.08);
    }

    .hero-text h1 {
      font-size: clamp(2rem, 6vw, 2.75rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.1;
      margin-bottom: 16px;
      animation: fadeUp 0.5s ease 0.05s both;
    }
    .hero-text p {
      font-size: 1.05rem;
      color: var(--text-muted);
      max-width: 420px;
      line-height: 1.65;
      animation: fadeUp 0.5s ease 0.15s both;
    }
    .avatar {
      flex-shrink: 0;
      width: 104px;
      height: 104px;
      border-radius: 18px;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.3);
      background: rgba(255, 255, 255, 0.1);
      animation: avatarPop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.1s both,
                 float 4s ease-in-out 1s infinite;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }

    /* ── SECTIONS ───────────────────────────────────────── */
    section {
      padding: 0;
      margin-bottom: 24px;
      border: none;
    }

    section.glass-tile {
      padding: 32px;
    }

    section h2 {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      margin-bottom: 24px;
    }
    .about-text { color: var(--text-muted); font-size: 0.97rem; line-height: 1.75; }

    /* ── STATS GRID ─────────────────────────────────────── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }
    @media (max-width: 480px) {
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
    }

    .stat-card {
      background: var(--glass-light);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--glass-border-light);
      border-radius: 20px;
      padding: 24px 20px;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.06),
        inset 0 1px 1px rgba(255, 255, 255, 0.5);
    }

    [data-theme="dark"] .stat-card {
      background: var(--glass-dark);
      border-color: var(--glass-border-dark);
      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.2),
        inset 0 1px 1px rgba(255, 255, 255, 0.05);
    }

    .stat-card:hover {
      transform: translateY(-4px);
      box-shadow:
        0 12px 48px rgba(0, 0, 0, 0.1),
        inset 0 1px 1px rgba(255, 255, 255, 0.5);
    }

    [data-theme="dark"] .stat-card:hover {
      box-shadow:
        0 12px 48px rgba(0, 0, 0, 0.3),
        inset 0 1px 1px rgba(255, 255, 255, 0.05);
    }

    .stat-card::before { display: none; }

    .stat-value {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1;
      color: var(--text);
      margin-bottom: 6px;
      font-variant-numeric: tabular-nums;
    }
    .stat-value .suffix {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--accent);
    }
    .stat-label {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 500;
      line-height: 1.3;
    }
    .stat-icon {
      font-size: 1.1rem;
      margin-bottom: 10px;
      display: block;
    }

    .reveal.visible .stat-card { animation: fadeUp 0.4s ease both; }
    .reveal.visible .stat-card:nth-child(1) { animation-delay: 0.05s; }
    .reveal.visible .stat-card:nth-child(2) { animation-delay: 0.10s; }
    .reveal.visible .stat-card:nth-child(3) { animation-delay: 0.15s; }
    .reveal.visible .stat-card:nth-child(4) { animation-delay: 0.20s; }
    .reveal.visible .stat-card:nth-child(5) { animation-delay: 0.25s; }
    .reveal.visible .stat-card:nth-child(6) { animation-delay: 0.30s; }

    /* ── ENTRY ROWS ─────────────────────────────────────── */
    .entry-list { display: flex; flex-direction: column; gap: 12px; }
    .entry {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      transition: all 0.25s ease;
    }

    [data-theme="dark"] .entry {
      background: rgba(255, 255, 255, 0.04);
      border-color: rgba(255, 255, 255, 0.08);
    }

    .entry:hover {
      background: rgba(255, 255, 255, 0.12);
      transform: translateX(6px);
    }

    [data-theme="dark"] .entry:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    .entry.project { align-items: flex-start; }

    .entry-icon {
      flex-shrink: 0;
      width: 44px;
      height: 44px;
      border-radius: 12px;
      border: 1.5px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
      transition: all 0.2s ease;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .entry:hover .entry-icon {
      border-color: var(--accent);
      background: rgba(59, 130, 246, 0.15);
      transform: scale(1.1);
    }

    .entry.project .entry-icon { margin-top: 2px; }
    .entry-icon img { width: 100%; height: 100%; object-fit: cover; border-radius: 10px; }

    .entry-body { flex: 1; min-width: 0; }
    .entry-body strong { display: block; font-size: 0.93rem; font-weight: 600; color: var(--text); }
    .entry-body .role  { font-size: 0.85rem; color: var(--text-muted); }
    .entry-body .proj-desc { display: block; font-size: 0.85rem; color: var(--text-muted); margin-top: 4px; line-height: 1.55; }
    .entry-body .proj-desc a { color: var(--accent); text-decoration: none; font-weight: 500; }
    .entry-body .proj-desc a:hover { text-decoration: underline; }
    .entry-body .proj-stack { display: block; font-size: 0.78rem; color: var(--text-dim); margin-top: 6px; }
    .entry-date { flex-shrink: 0; font-size: 0.82rem; color: var(--text-dim); white-space: nowrap; text-align: right; }

    /* ── SKILLS ─────────────────────────────────────────── */
    .skill-list { display: flex; flex-wrap: wrap; gap: 10px; }
    .skill-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 16px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: var(--pill-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: var(--pill-text);
      font-size: 0.83rem;
      font-weight: 500;
      transition: all 0.25s ease;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    }

    [data-theme="dark"] .skill-pill {
      border-color: rgba(255, 255, 255, 0.12);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
    }

    .skill-pill:hover {
      border-color: var(--accent);
      transform: translateY(-3px);
      background: rgba(59, 130, 246, 0.15);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
    }

    .pill-icon { font-size: 0.95rem; line-height: 1; }

    /* ── CONTACT ────────────────────────────────────────── */
    .contact-wrap { padding: 0; border-top: none; margin-top: 32px; }
    .contact-box {
      position: relative;
      background: var(--glass-light);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--glass-border-light);
      border-radius: 28px;
      padding: 60px 40px 48px;
      text-align: center;
      overflow: hidden;
      transition: all 0.3s ease;
      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.08),
        inset 0 1px 1px rgba(255, 255, 255, 0.6);
    }

    [data-theme="dark"] .contact-box {
      background: var(--glass-dark);
      border-color: var(--glass-border-dark);
      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.3),
        inset 0 1px 1px rgba(255, 255, 255, 0.08);
    }

    .contact-box:hover {
      transform: translateY(-4px);
      box-shadow:
        0 12px 48px rgba(0, 0, 0, 0.12),
        inset 0 1px 1px rgba(255, 255, 255, 0.6);
    }

    [data-theme="dark"] .contact-box:hover {
      box-shadow:
        0 12px 48px rgba(0, 0, 0, 0.4),
        inset 0 1px 1px rgba(255, 255, 255, 0.08);
    }

    .contact-box::before { display: none; }

    .contact-tag {
      position: absolute;
      top: -14px; left: 50%;
      transform: translateX(-50%);
      background: var(--text);
      color: var(--accent);
      font-size: 0.8rem;
      font-weight: 600;
      padding: 5px 20px;
      border-radius: 999px;
      letter-spacing: 0.02em;
      white-space: nowrap;
      border: 1px solid var(--accent);
    }
    .contact-box h2 {
      position: relative;
      font-size: clamp(1.8rem, 5vw, 2.5rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 14px;
    }
    .contact-box p { position: relative; font-size: 0.95rem; color: var(--text-muted); line-height: 1.65; }
    .contact-box a { color: var(--accent); text-decoration: none; font-weight: 500; }
    .contact-box a:hover { text-decoration: underline; }

    /* ── FLOATING NAV ───────────────────────────────────── */
    .floating-nav {
      position: fixed;
      bottom: 28px; left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 8px 12px;
      background: var(--nav-bg);
      border: 1px solid var(--nav-border);
      border-radius: 999px;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
      z-index: 100;
      animation: navSlideUp 0.5s ease 0.35s both;
    }

    [data-theme="dark"] .floating-nav {
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .nav-btn {
      width: 40px; height: 40px;
      border-radius: 50%;
      border: none;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      transition: all 0.2s ease;
      text-decoration: none;
    }
    .nav-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      color: var(--text);
      transform: translateY(-3px);
    }

    [data-theme="dark"] .nav-btn:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    .nav-btn:active { transform: translateY(-1px); }
    .nav-btn svg { width: 18px; height: 18px; }

    /* ── VIDEO CONTROL BUTTON ───────────────────────────── */
    .video-control-btn {
      position: fixed;
      top: 28px;
      left: 28px;
      width: 54px;
      height: 54px;
      border-radius: 50%;
      border: 1px solid var(--nav-border);
      background: var(--nav-bg);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      transition: all 0.2s ease;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
      z-index: 99;
    }

    [data-theme="dark"] .video-control-btn {
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .video-control-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      color: var(--text);
      transform: scale(1.1);
    }

    [data-theme="dark"] .video-control-btn:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    .video-control-btn:active {
      transform: scale(0.95);
    }

    .video-control-btn svg {
      width: 24px;
      height: 24px;
    }

    /* ── RESPONSIVE ─────────────────────────────────────── */
    @media (max-width: 520px) {
      .hero { flex-direction: column-reverse; padding: 32px; gap: 16px; }
      .avatar { width: 80px; height: 80px; }
      .entry-date { display: none; }
      .contact-box { padding: 48px 24px 36px; }
      .glass-tile { padding: 24px; }
      section.glass-tile { padding: 24px; }
      .stats-grid { gap: 12px; }
      .entry-list { gap: 10px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition-duration: 0.01ms !important; }
      .reveal { opacity: 1; transform: none; }
    }
  </style>

  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>

<script>
  // ================================================================
  // BACKGROUND MEDIA PRIORITY
  // ================================================================

  const backgroundMedia = document.getElementById('backgroundMedia');
const muteBtn = document.getElementById('videoMuteBtn');
const iconVolume = document.getElementById('iconVolume');
const iconVolumeMuted = document.getElementById('iconVolumeMuted');

const BACKGROUND_PNG = 'background.png';
const BACKGROUND_MP4 = 'background.mp4';

let backgroundVideo = null;

// ------------------------------------------------
// Load PNG
// ------------------------------------------------

function tryBackgroundPng() {
  return new Promise((resolve) => {
    const image = new Image();

    image.onload = () => {
      image.className = 'bg-image';
      image.alt = '';
      image.setAttribute('aria-hidden', 'true');
      resolve(image);
    };

    image.onerror = () => resolve(null);
    image.src = BACKGROUND_PNG;
  });
}


function tryBackgroundMp4() {
  return new Promise((resolve) => {
    const video = document.createElement('video');
    const source = document.createElement('source');

    video.id = 'bgVideo';
    video.className = 'bg-video';
    video.muted = true;
    video.autoplay = true;
    video.loop = true;
    video.playsInline = true;
    video.preload = 'auto';

    video.addEventListener('loadeddata', () => resolve(video), { once: true });
    video.addEventListener('error', () => resolve(null), { once: true });

    source.src = BACKGROUND_MP4;
    source.type = 'video/mp4';
    video.appendChild(source);
    video.load();
  });
}

async function initializeBackground() {
  const pngPromise = tryBackgroundPng();
  const mp4Promise = tryBackgroundMp4();

  // Priority 1: PNG
  const image = await pngPromise;
  if (image) {
    backgroundMedia.appendChild(image);
    muteBtn.style.display = 'none';
    return;
  }

  // Priority 2: MP4
  const video = await mp4Promise;
  if (video) {
    backgroundVideo = video;
    backgroundMedia.appendChild(video);
    video.play().catch(() => {});
    muteBtn.style.display = 'flex';
    loadSavedVideoMuteState();
    return;
  }

  muteBtn.style.display = 'none';
}

  // ------------------------------------------------
  // MP4 mute control
  // ------------------------------------------------

  function updateVolumeIcon() {
    if (!backgroundVideo) return;

    if (backgroundVideo.muted) {
      iconVolume.style.display = 'none';
      iconVolumeMuted.style.display = 'block';
      muteBtn.setAttribute('title', 'Unmute video');
      muteBtn.setAttribute('aria-label', 'Unmute video');
    } else {
      iconVolume.style.display = 'block';
      iconVolumeMuted.style.display = 'none';
      muteBtn.setAttribute('title', 'Mute video');
      muteBtn.setAttribute('aria-label', 'Mute video');
    }
  }

  function loadSavedVideoMuteState() {
  if (!backgroundVideo) return;
  backgroundVideo.muted = true;
  updateVolumeIcon();
}

  muteBtn.addEventListener('click', () => {
    if (!backgroundVideo) return;

    backgroundVideo.muted = !backgroundVideo.muted;
    localStorage.setItem('videoMuted', String(backgroundVideo.muted));
    updateVolumeIcon();
  });

  initializeBackground();


  // ================================================================
  // THEME
  // ================================================================

  const root   = document.documentElement;
  const toggle = document.getElementById('themeToggle');
  const sun    = document.getElementById('iconSun');
  const moon   = document.getElementById('iconMoon');

  const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const saved = localStorage.getItem('theme') || (systemDark ? 'dark' : 'light');
  applyTheme(saved);

  toggle.addEventListener('click', () => {
    const next = root.dataset.theme === 'dark' ? 'light' : 'dark';
    applyTheme(next);
    localStorage.setItem('theme', next);
  });

  function applyTheme(t) {
    root.dataset.theme = t;
    sun.style.display  = t === 'dark'  ? 'block' : 'none';
    moon.style.display = t === 'light' ? 'block' : 'none';
  }


  // ================================================================
  // SCROLL REVEAL
  // ================================================================

  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('visible');
        entry.target.querySelectorAll('.count').forEach(startCount);
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.1 });

  document.querySelectorAll('.reveal').forEach(el => observer.observe(el));


  // ================================================================
  // COUNTING ANIMATION
  // ================================================================

  function startCount(el) {
    const target = parseInt(el.dataset.target, 10);
    const suffix = el.dataset.suffix || '';
    const duration = 1200;
    const startTime = performance.now();

    function easeOut(t) { return 1 - (1 - t) * (1 - t); }

    function tick(now) {
      const elapsed = now - startTime;
      const progress = Math.min(elapsed / duration, 1);
      const value = Math.round(easeOut(progress) * target);
      el.textContent = value;
      if (suffix) {
        el.innerHTML = value + '<span class="suffix">' + suffix + '</span>';
      }
      if (progress < 1) requestAnimationFrame(tick);
    }

    requestAnimationFrame(tick);
  }
</script>
