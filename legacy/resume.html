<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Horizon - Resume</title>
  <meta name="description" content="Horizon's Resume" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --text:         #0f172a;
      --text-muted:   #64748b;
      --text-dim:     #94a3b8;
      --accent:       #3b82f6;
      --glass-light:  rgba(255, 255, 255, 0.55);
      --glass-border-light: rgba(255, 255, 255, 0.35);
      --glass-dark:   rgba(20, 20, 30, 0.45);
      --glass-border-dark: rgba(255, 255, 255, 0.15);
      --nav-bg:       rgba(255, 255, 255, 0.7);
      --nav-border:   rgba(255, 255, 255, 0.4);
      --pill-bg:      rgba(255, 255, 255, 0.4);
      --pill-text:    #334155;
    }

    [data-theme="dark"] {
      --text:         #f0f6fc;
      --text-muted:   #8b949e;
      --text-dim:     #484f58;
      --accent:       #58a6ff;
      --glass-light:  rgba(20, 20, 30, 0.45);
      --glass-border-light: rgba(255, 255, 255, 0.15);
      --glass-dark:   rgba(20, 20, 30, 0.5);
      --glass-border-dark: rgba(255, 255, 255, 0.12);
      --nav-bg:       rgba(20, 20, 30, 0.6);
      --nav-border:   rgba(255, 255, 255, 0.15);
      --pill-bg:      rgba(255, 255, 255, 0.12);
      --pill-text:    #c9d1d9;
    }

    /* ── RESET ─────────────────────────────────────────── */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #ffffff;
      color: var(--text);
      line-height: 1.6;
      transition: color 0.2s;
      padding-bottom: 120px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    [data-theme="dark"] body {
      background-color: #0f1117;
    }

    /* ── LAYOUT ─────────────────────────────────────────── */
    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 16px;
      width: 100%;
    }

    .page-wrap {
      flex: 1;
    }

    /* ── KEYFRAMES ──────────────────────────────────────── */
    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(18px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes navSlideUp {
      from {
        opacity: 0;
        transform: translateX(-50%) translateY(16px);
      }

      to {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
    }

    /* ── TAB SWITCHER ───────────────────────────────────── */
    .tab-bar {
      display: flex;
      gap: 8px;
      padding: 20px 0 32px;
    }

    .tab-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      transition: all 0.2s ease;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      cursor: pointer;
    }

    [data-theme="dark"] .tab-link {
      background: rgba(255, 255, 255, 0.04);
      border-color: rgba(255, 255, 255, 0.08);
    }

    .tab-link:hover {
      background: rgba(255, 255, 255, 0.12);
      color: var(--text);
      border-color: rgba(255, 255, 255, 0.2);
    }

    [data-theme="dark"] .tab-link:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.15);
    }

    .tab-link.active {
      background: rgba(255, 255, 255, 0.15);
      color: var(--text);
      border-color: rgba(255, 255, 255, 0.25);
    }

    [data-theme="dark"] .tab-link.active {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .tab-link svg {
      width: 14px;
      height: 14px;
    }

    /* ── PAGE HEADER ────────────────────────────────────── */
    .page-header {
      padding: 32px 0 20px;
      animation: fadeUp 0.5s ease 0.05s both;
    }

    .page-header h1 {
      font-size: clamp(1.8rem, 5vw, 2.4rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.1;
      margin-bottom: 8px;
    }

    .page-header p {
      font-size: 0.97rem;
      color: var(--text-muted);
    }

    /* ── RESUME CONTENT ─────────────────────────────────── */
    .resume-wrap {
      background: var(--glass-light);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--glass-border-light);
      border-radius: 28px;
      padding: 48px 52px;
      animation: fadeUp 0.5s ease 0.15s both;
      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.08),
        inset 0 1px 1px rgba(255, 255, 255, 0.6);
      transition: all 0.3s ease;
    }

    [data-theme="dark"] .resume-wrap {
      background: var(--glass-dark);
      border-color: var(--glass-border-dark);
      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.3),
        inset 0 1px 1px rgba(255, 255, 255, 0.08);
    }

    .resume-wrap:hover {
      box-shadow:
        0 12px 48px rgba(0, 0, 0, 0.12),
        inset 0 1px 1px rgba(255, 255, 255, 0.6);
    }

    [data-theme="dark"] .resume-wrap:hover {
      box-shadow:
        0 12px 48px rgba(0, 0, 0, 0.4),
        inset 0 1px 1px rgba(255, 255, 255, 0.08);
    }

    /* ── MOVED PAGE ─────────────────────────────────────── */
    .moved-card {
      max-width: 440px;
      margin: 0 auto;
      text-align: center;
      padding: 20px 0;
    }

    .moved-card h1 {
      font-size: 1.7rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 14px;
      color: var(--text);
    }

    .moved-card p {
      color: var(--text-muted);
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .moved-card a.btn {
      display: inline-block;
      padding: 12px 24px;
      background: #d4af37;
      color: #0a0d13;
      font-weight: 700;
      font-size: 0.92rem;
      text-decoration: none;
      border-radius: 10px;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .moved-card a.btn:hover {
      background: #e6c765;
      transform: translateY(-2px);
    }

    /* ── FOOTER ─────────────────────────────────────────── */
    .resume-footer {
      margin-top: 20px;
      padding: 16px 20px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      animation: fadeUp 0.5s ease 0.25s both;
      transition: all 0.3s ease;
    }

    [data-theme="dark"] .resume-footer {
      background: rgba(255, 255, 255, 0.04);
      border-color: rgba(255, 255, 255, 0.08);
    }

    .resume-footer:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.2);
    }

    [data-theme="dark"] .resume-footer:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.15);
    }

    .resume-footer .footer-left {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .resume-footer .footer-left strong {
      color: var(--text);
      font-weight: 600;
    }

    .footer-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--text-dim);
      flex-shrink: 0;
    }

    .footer-note {
      font-size: 0.78rem;
      color: var(--text-dim);
      font-style: italic;
    }

    /* ── FLOATING NAV ───────────────────────────────────── */
    .floating-nav {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 8px 12px;
      background: var(--nav-bg);
      border: 1px solid var(--nav-border);
      border-radius: 999px;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
      z-index: 100;
      animation: navSlideUp 0.5s ease 0.35s both;
    }

    [data-theme="dark"] .floating-nav {
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .nav-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .nav-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      color: var(--text);
      transform: translateY(-3px);
    }

    [data-theme="dark"] .nav-btn:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    .nav-btn:active {
      transform: translateY(-1px);
    }

    .nav-btn svg {
      width: 18px;
      height: 18px;
    }

    /* ── RESPONSIVE ─────────────────────────────────────── */
    @media (max-width: 520px) {
      .resume-wrap {
        padding: 32px 24px;
      }

      .resume-footer {
        flex-direction: column;
        align-items: flex-start;
        gap: 6px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<script>
  // ── THEME ───────────────────────────────────────────────
  const root = document.documentElement;
  const toggle = document.getElementById('themeToggle');
  const sun = document.getElementById('iconSun');
  const moon = document.getElementById('iconMoon');

  const systemDark =
    window.matchMedia('(prefers-color-scheme: dark)').matches;

  const saved =
    localStorage.getItem('theme') ||
    (systemDark ? 'dark' : 'light');

  applyTheme(saved);

  toggle.addEventListener('click', () => {
    const next =
      root.dataset.theme === 'dark'
        ? 'light'
        : 'dark';

    applyTheme(next);
    localStorage.setItem('theme', next);
  });

  function applyTheme(t) {
    root.dataset.theme = t;

    sun.style.display =
      t === 'dark'
        ? 'block'
        : 'none';

    moon.style.display =
      t === 'light'
        ? 'block'
        : 'none';
  }

  // ── LAST UPDATED DATE ───────────────────────────────────
  const LAST_UPDATED = "April 2026";

  document.getElementById('lastUpdated').textContent =
    LAST_UPDATED;
</script>
