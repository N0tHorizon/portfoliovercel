<title>Horizon — In Development</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>

/* ================================================================
   MODULE: Palette
   Purpose:   CSS custom properties for the whole site, light/dark.
   Depends:   nothing — this must load before every other module.
   Remove:    do not remove. Every other module reads these vars.
   ================================================================ */
:root {
  --main-color:   #a1a5a8;
  --accent:       #d4af37;
  --accent-light: #e6c765;
  --accent-dark:  #9c7c20;
  --red:          #bf4040;
  --brown:        #bf8040;
  --green:        #40bf40;
  --blue:         #4080bf;
  --purple:       #8040bf;
  --dark-grey:    #737d8c;

  --text:         #0f172a;
  --text-muted:   #4b5563;
  --text-dim:     #6b7280;

  --glass:        rgba(255, 255, 255, 0.55);
  --glass-border: rgba(255, 255, 255, 0.35);
  --nav-bg:       rgba(255, 255, 255, 0.7);
  --nav-border:   rgba(255, 255, 255, 0.4);
}

[data-theme="dark"] {
  --main-color:   #0a0d13;
  --accent:       #d4af37;
  --accent-light: #e6c765;
  --accent-dark:  #9c7c20;
  --red:          #e61919;
  --brown:        #e67319;
  --green:        #19e619;
  --blue:         #1973e6;
  --purple:       #7319e6;
  --dark-grey:    #273545;

  --text:         #f0f6fc;
  --text-muted:   #8b949e;
  --text-dim:     #565f6b;

  --glass:        rgba(20, 20, 30, 0.5);
  --glass-border: rgba(255, 255, 255, 0.12);
  --nav-bg:       rgba(20, 20, 30, 0.6);
  --nav-border:   rgba(255, 255, 255, 0.15);
}


/* ================================================================
   MODULE: Reset & Base
   Purpose:   box model reset, base body styles.
   Depends:   Palette module (--main-color, --text).
   Remove:    do not remove. Everything sits on top of this.
   ================================================================ */
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
html, body { height: 100%; }

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--main-color);
  color: var(--text);
  line-height: 1.6;
  transition: background 0.2s ease, color 0.2s ease;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}


/* ================================================================
   MODULE: Archive Banner
   Purpose:   dismissible "page not complete" warning strip.
   Depends:   Palette module. JS module "Archive Banner" below.
   Remove:    yes — delete this block, the matching HTML block,
              and the matching JS block. Nothing else references it.
   ================================================================ */
.archive-banner {
  position: relative;
  width: 100%;
  padding: 12px 48px;
  background: #b91c1c;
  color: #ffffff;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  font-size: 0.9rem;
  font-weight: 700;
  text-align: center;
  border-bottom: 2px solid #7f1d1d;
  box-shadow: 0 2px 10px rgba(185, 28, 28, 0.25);
  max-height: 60px;
  overflow: hidden;
  opacity: 1;
  transition: max-height 0.3s ease, opacity 0.25s ease, padding 0.3s ease, border-width 0.3s ease;
  z-index: 200;
}
.archive-banner.collapsed {
  max-height: 0;
  padding-top: 0;
  padding-bottom: 0;
  opacity: 0;
  border-bottom-width: 0;
  box-shadow: none;
}
.archive-icon {
  font-size: 1.15rem;
  line-height: 1;
}
.archive-close {
  position: absolute;
  right: 14px;
  top: 50%;
  transform: translateY(-50%);
  width: 26px;
  height: 26px;
  border: none;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.15);
  color: #ffffff;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.95rem;
  line-height: 1;
  transition: background 0.2s ease;
  flex-shrink: 0;
}
.archive-close:hover {
  background: rgba(255, 255, 255, 0.28);
}
@media (max-width: 520px) {
  .archive-banner {
    font-size: 0.8rem;
    padding: 11px 40px;
  }
  .archive-icon {
    font-size: 1rem;
  }
  .archive-close {
    right: 10px;
    width: 24px;
    height: 24px;
  }
}


/* ================================================================
   MODULE: Background Media
   Purpose:   fullscreen PNG/MP4 background layer.
              The mute *button* itself is physically markup'd inside
              the Sidebar module (see below) — this module only
              owns the background layer + the mute button's
              behavior, driven by id="videoMuteBtn" wherever it
              physically lives in the DOM.
   Depends:   Palette module. JS module "Background Media" below.
              CROSS-MODULE: #videoMuteBtn lives in Sidebar's HTML,
              not this module's HTML — see note there.
   Remove:    removing this CSS block is safe on its own (only the
              background layer disappears, page falls back to flat
              --main-color). To fully remove the feature you also
              need to delete #videoMuteBtn from the Sidebar module
              and the JS module below.
   ================================================================ */
.bg-video, .bg-image {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: -1;
}


/* ================================================================
   MODULE: Sidebar
   Purpose:   fixed vertical icon rail, left side of viewport.
              Holds: Discord link, GitHub link, mute toggle
              (behavior owned by Background Media JS), theme
              toggle (behavior owned by Theme JS).
   Depends:   Palette module.
   Remove:    yes — delete this CSS block and the matching HTML
              block. If you do, also relocate #videoMuteBtn and
              #themeToggle elsewhere, or their JS modules will
              silently no-op (they check the element exists first).
   ================================================================ */
.sidebar {
  position: fixed;
  left: 24px;
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 12px 8px;
  background: var(--nav-bg);
  border: 1px solid var(--nav-border);
  border-radius: 999px;
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
  z-index: 99;
}

.sidebar-btn {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  border: none;
  background: transparent;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-muted);
  transition: all 0.2s ease;
  text-decoration: none;
}
.sidebar-btn:hover {
  background: rgba(255, 255, 255, 0.15);
  color: var(--text);
  transform: scale(1.08);
}
[data-theme="dark"] .sidebar-btn:hover {
  background: rgba(255, 255, 255, 0.1);
}
.sidebar-btn:active { transform: scale(0.94); }
.sidebar-btn svg { width: 19px; height: 19px; }

.sidebar-divider {
  width: 22px;
  height: 1px;
  background: var(--glass-border);
  margin: 4px 0;
  flex-shrink: 0;
}

@media (max-width: 760px) {
  .sidebar {
    left: 50%;
    top: auto;
    bottom: 24px;
    transform: translateX(-50%);
    flex-direction: row;
  }
  .sidebar-divider {
    width: 1px;
    height: 22px;
    margin: 0 4px;
  }
}


/* ================================================================
   MODULE: Topbar
   Purpose:   centered horizontal nav, three site sections:
              Portfolio / Resume / About Me.
              Active-state highlighting only for now — actual page
              switching is owned by the Router module (not yet
              built). Each link carries data-route, ready for the
              Router to intercept.
   Depends:   Palette module. JS module "Topbar" below.
   Remove:    yes — delete this CSS block, the matching HTML block,
              and the matching JS block.
   ================================================================ */
.topbar {
  position: fixed;
  top: 24px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 6px;
  background: var(--nav-bg);
  border: 1px solid var(--nav-border);
  border-radius: 999px;
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
  z-index: 99;
}

.topbar-link {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 9px 18px;
  border-radius: 999px;
  font-size: 0.85rem;
  font-weight: 600;
  text-decoration: none;
  color: var(--text-muted);
  background: transparent;
  transition: all 0.2s ease;
  white-space: nowrap;
}
.topbar-link:hover {
  color: var(--text);
  background: rgba(255, 255, 255, 0.1);
}
[data-theme="dark"] .topbar-link:hover {
  background: rgba(255, 255, 255, 0.06);
}
.topbar-link.active {
  color: #0a0d13;
  background: var(--accent);
}
.topbar-link.active:hover {
  background: var(--accent-light);
}
.topbar-link svg { width: 15px; height: 15px; flex-shrink: 0; }

@media (max-width: 520px) {
  .topbar-link span.label { display: none; }
  .topbar-link { padding: 10px; }
  .topbar-link svg { width: 17px; height: 17px; }
}


/* ================================================================
   MODULE: Page Layout / View Root
   Purpose:   the scrollable content column + the placeholder card.
              #view is the future router's mount point — swap the
              placeholder for real router-rendered content later.
   Depends:   Palette module. Padding accounts for the fixed
              Topbar (top) and Sidebar (left, desktop only).
   Remove:    do not remove — this holds the actual page content.
   ================================================================ */
.page-wrap {
  flex: 1;
  display: flex;
}
.container {
  max-width: 960px;
  margin: 0 auto;
  padding: 120px 24px 160px;
  width: 100%;
}
@media (min-width: 761px) {
  .container { padding-left: 100px; }
}

.placeholder {
  background: var(--glass);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border: 1px solid var(--glass-border);
  border-radius: 28px;
  padding: 48px;
  text-align: center;
}
.placeholder h1 {
  font-size: clamp(1.6rem, 4vw, 2.2rem);
  font-weight: 800;
  letter-spacing: -0.02em;
  margin-bottom: 10px;
}
.placeholder p {
  color: var(--text-muted);
  font-size: 0.95rem;
}


/* ================================================================
   MODULE: Bento Grid
   Purpose:   the actual content grid — blank frosted-glass tiles
              in various shapes/sizes. No content assigned yet;
              just structure to build against.

              Sizing convention: tile-{cols}x{rows}, e.g. tile-1x3
              is 1 column wide, 3 rows tall. Base unit is one grid
              cell (--bento-row tall x one grid-template-columns
              track wide). Mix and match spans freely — a tile can
              be any {cols}x{rows} combination, these classes just
              cover the shapes discussed so far plus two bonus wide
              variants (tile-2x1, tile-3x1) for symmetry with the
              tall ones. Add more span combos the same way if a
              future layout needs a shape not listed here.

              tile-l is a true L-shaped card (not a rectangle) —
              a 2x2 bounding box with one corner cut via clip-path.
              backdrop-filter still respects the clipped shape in
              current major browsers, but this is the one tile type
              worth a visual sanity-check in Safari specifically if
              it ever ships with real content.
   Depends:   Palette module (--glass, --glass-border).
   Remove:    yes — delete this CSS block and the matching HTML
              block. No JS module backs this one; it's pure layout.
   ================================================================ */
.bento-grid {
  --bento-row: 130px;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  grid-auto-rows: var(--bento-row);
  gap: 20px;
}

.tile {
  position: relative;
  background: var(--glass);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border: 1px solid var(--glass-border);
  border-radius: 24px;
  box-shadow:
    0 8px 32px rgba(0, 0, 0, 0.12),
    inset 0 1px 1px rgba(255, 255, 255, 0.15);
  transition: transform 0.25s ease, box-shadow 0.25s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.tile:hover {
  transform: translateY(-3px);
  box-shadow:
    0 12px 40px rgba(0, 0, 0, 0.18),
    inset 0 1px 1px rgba(255, 255, 255, 0.15);
}

.tile-label {
  font-size: 0.78rem;
  font-weight: 600;
  letter-spacing: 0.04em;
  color: var(--text-dim);
  text-transform: uppercase;
  pointer-events: none;
}

/* requested variants */
.tile-1x1 { grid-column: span 1; grid-row: span 1; }
.tile-1x2 { grid-column: span 1; grid-row: span 2; }
.tile-1x3 { grid-column: span 1; grid-row: span 3; }
.tile-2x2 { grid-column: span 2; grid-row: span 2; }

.tile-l {
  grid-column: span 2;
  grid-row: span 2;
  clip-path: polygon(0% 0%, 50% 0%, 50% 50%, 100% 50%, 100% 100%, 0% 100%);
}

/* bonus variants — wide counterparts to the tall 1x2 / 1x3 tiles */
.tile-2x1 { grid-column: span 2; grid-row: span 1; }
.tile-3x1 { grid-column: span 3; grid-row: span 1; }

@media (max-width: 900px) {
  .bento-grid { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 560px) {
  .bento-grid { grid-template-columns: 1fr; }
  /* on a single column, force every tile back to 1 column wide
     so wide/L spans don't overflow the only available track */
  .tile-2x2, .tile-l, .tile-2x1, .tile-3x1 { grid-column: span 1; }
}


/* ================================================================
   MODULE: Accessibility
   Purpose:   respect prefers-reduced-motion globally.
   Depends:   nothing.
   Remove:    do not remove.
   ================================================================ */
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

</style>

<script>

/* ================================================================
   MODULE: Archive Banner
   Purpose:    dismiss + collapse the "not complete" banner, and
               remember the dismissal for the current tab session.
   Depends on: #archiveBanner, #archiveClose
   Remove:     yes, safely — nothing else in this file reads from
               archiveBanner/archiveClose. Delete this whole block
               plus its matching CSS and HTML modules.
   ================================================================ */
(function ArchiveBannerModule() {
  const banner = document.getElementById('archiveBanner');
  const closeBtn = document.getElementById('archiveClose');
  if (!banner || !closeBtn) return;

  if (sessionStorage.getItem('bannerDismissed') === 'true') {
    banner.classList.add('collapsed');
  }

  closeBtn.addEventListener('click', () => {
    banner.classList.add('collapsed');
    sessionStorage.setItem('bannerDismissed', 'true');
  });
})();


/* ================================================================
   MODULE: Background Media
   Purpose:    load /resources/background.png, falling back to
               /resources/background.mp4 if the PNG isn't present.
               Owns the mute toggle's behavior, even though the
               button itself is physically placed in the Sidebar
               module's HTML.
   Depends on: #backgroundMedia, #videoMuteBtn, #iconVolume,
               #iconVolumeMuted
   Remove:     yes, safely — delete this block plus the matching
               CSS module and #videoMuteBtn from Sidebar's HTML.
   ================================================================ */
(function BackgroundMediaModule() {
  const backgroundMedia = document.getElementById('backgroundMedia');
  const muteBtn = document.getElementById('videoMuteBtn');
  const iconVolume = document.getElementById('iconVolume');
  const iconVolumeMuted = document.getElementById('iconVolumeMuted');
  if (!backgroundMedia || !muteBtn) return;

  const BACKGROUND_PNG = '/resources/background.png';
  const BACKGROUND_MP4 = '/resources/background.mp4';

  let backgroundVideo = null;

  function tryBackgroundPng() {
    return new Promise((resolve) => {
      const image = new Image();
      image.onload = () => {
        image.className = 'bg-image';
        image.alt = '';
        image.setAttribute('aria-hidden', 'true');
        resolve(image);
      };
      image.onerror = () => resolve(null);
      image.src = BACKGROUND_PNG;
    });
  }

  function tryBackgroundMp4() {
    return new Promise((resolve) => {
      const video = document.createElement('video');
      const source = document.createElement('source');

      video.id = 'bgVideo';
      video.className = 'bg-video';
      video.muted = true;
      video.autoplay = true;
      video.loop = true;
      video.playsInline = true;
      video.preload = 'auto';

      video.addEventListener('loadeddata', () => resolve(video), { once: true });
      video.addEventListener('error', () => resolve(null), { once: true });

      source.src = BACKGROUND_MP4;
      source.type = 'video/mp4';
      video.appendChild(source);
      video.load();
    });
  }

  function updateVolumeIcon() {
    if (!backgroundVideo) return;
    if (backgroundVideo.muted) {
      iconVolume.style.display = 'none';
      iconVolumeMuted.style.display = 'block';
      muteBtn.setAttribute('title', 'Unmute video');
      muteBtn.setAttribute('aria-label', 'Unmute video');
    } else {
      iconVolume.style.display = 'block';
      iconVolumeMuted.style.display = 'none';
      muteBtn.setAttribute('title', 'Mute video');
      muteBtn.setAttribute('aria-label', 'Mute video');
    }
  }

  function loadSavedVideoMuteState() {
    if (!backgroundVideo) return;
    backgroundVideo.muted = true; // always start muted on load/refresh
    updateVolumeIcon();
  }

  async function initializeBackground() {
    const pngPromise = tryBackgroundPng();
    const mp4Promise = tryBackgroundMp4();

    const image = await pngPromise;
    if (image) {
      backgroundMedia.appendChild(image);
      muteBtn.style.display = 'none';
      return;
    }

    const video = await mp4Promise;
    if (video) {
      backgroundVideo = video;
      backgroundMedia.appendChild(video);
      video.play().catch(() => {});
      muteBtn.style.display = 'flex';
      loadSavedVideoMuteState();
      return;
    }

    muteBtn.style.display = 'none';
  }

  muteBtn.addEventListener('click', () => {
    if (!backgroundVideo) return;
    backgroundVideo.muted = !backgroundVideo.muted;
    localStorage.setItem('videoMuted', String(backgroundVideo.muted));
    updateVolumeIcon();
  });

  initializeBackground();
})();


/* ================================================================
   MODULE: Theme
   Purpose:    light/dark toggle, persisted via localStorage, with
               system-preference fallback on first visit. Owns the
               toggle's behavior, even though the button itself is
               physically placed in the Sidebar module's HTML.
   Depends on: #themeToggle, #iconSun, #iconMoon, [data-theme] on
               <html>
   Remove:     yes, safely — delete this block plus the matching
               CSS module and #themeToggle from Sidebar's HTML.
               Site stays on whatever data-theme is hardcoded on
               <html> (currently "dark").
   ================================================================ */
(function ThemeModule() {
  const root   = document.documentElement;
  const toggle = document.getElementById('themeToggle');
  const sun    = document.getElementById('iconSun');
  const moon   = document.getElementById('iconMoon');
  if (!toggle || !sun || !moon) return;

  function applyTheme(t) {
    root.dataset.theme = t;
    sun.style.display  = t === 'dark'  ? 'block' : 'none';
    moon.style.display = t === 'light' ? 'block' : 'none';
  }

  const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const saved = localStorage.getItem('theme') || (systemDark ? 'dark' : 'light');
  applyTheme(saved);

  toggle.addEventListener('click', () => {
    const next = root.dataset.theme === 'dark' ? 'light' : 'dark';
    applyTheme(next);
    localStorage.setItem('theme', next);
  });
})();


/* ================================================================
   MODULE: Topbar
   Purpose:    highlights whichever tab matches the current URL
               hash. This is ACTIVE-STATE TRACKING ONLY — it does
               not swap page content. That's the Router module's
               job once built; this module is safe to keep as-is
               when the Router is added (the Router will just also
               start listening to hash changes for content).
   Depends on: #topbar, .topbar-link[data-route]
   Remove:     yes, safely — delete this block plus the matching
               CSS and HTML modules.
   ================================================================ */
(function TopbarModule() {
  const topbar = document.getElementById('topbar');
  if (!topbar) return;

  const links = Array.from(topbar.querySelectorAll('.topbar-link'));

  function currentRoute() {
    const hash = window.location.hash.replace(/^#/, '');
    return hash === '' ? '/' : hash;
  }

  function updateActive() {
    const route = currentRoute();
    links.forEach(link => {
      link.classList.toggle('active', link.dataset.route === route);
    });
  }

  window.addEventListener('hashchange', updateActive);
  updateActive();
})();
