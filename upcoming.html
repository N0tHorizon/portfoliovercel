<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Horizon — In Development</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<style>

:root {
  --main-color:   #a1a5a8;
  --accent:       #d4af37;
  --accent-light: #e6c765;
  --accent-dark:  #9c7c20;
  --red:          #bf4040;
  --brown:        #bf8040;
  --green:        #40bf40;
  --blue:         #4080bf;
  --purple:       #8040bf;
  --dark-grey:    #737d8c;

  --text:         #0f172a;
  --text-muted:   #4b5563;
  --text-dim:     #6b7280;

  --glass:        rgba(255, 255, 255, 0.55);
  --glass-border: rgba(255, 255, 255, 0.35);
  --nav-bg:       rgba(255, 255, 255, 0.7);
  --nav-border:   rgba(255, 255, 255, 0.4);
}

[data-theme="dark"] {
  --main-color:   #0a0d13;
  --accent:       #d4af37;
  --accent-light: #e6c765;
  --accent-dark:  #9c7c20;
  --red:          #e61919;
  --brown:        #e67319;
  --green:        #19e619;
  --blue:         #1973e6;
  --purple:       #7319e6;
  --dark-grey:    #273545;

  --text:         #f0f6fc;
  --text-muted:   #8b949e;
  --text-dim:     #565f6b;

  --glass:        rgba(20, 20, 30, 0.5);
  --glass-border: rgba(255, 255, 255, 0.12);
  --nav-bg:       rgba(20, 20, 30, 0.6);
  --nav-border:   rgba(255, 255, 255, 0.15);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
html, body { height: 100%; }

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--main-color);
  color: var(--text);
  line-height: 1.6;
  transition: background 0.2s ease, color 0.2s ease;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

@keyframes dropIn {
  0%   { opacity: 0; transform: translateY(-40px); }
  60%  { opacity: 1; transform: translateY(6px); }
  100% { opacity: 1; transform: translateY(0); }
}
@keyframes slideInLeft {
  0%   { opacity: 0; transform: translate(-60px, -50%) scale(0.85); }
  60%  { opacity: 1; transform: translate(6px, -50%) scale(1.03); }
  100% { opacity: 1; transform: translate(0, -50%) scale(1); }
}
@keyframes slideInLeftMobile {
  0%   { opacity: 0; transform: translate(-50%, 60px) scale(0.85); }
  60%  { opacity: 1; transform: translate(-50%, -6px) scale(1.03); }
  100% { opacity: 1; transform: translate(-50%, 0) scale(1); }
}
@keyframes dropInCentered {
  0%   { opacity: 0; transform: translate(-50%, -40px); }
  60%  { opacity: 1; transform: translate(-50%, 6px); }
  100% { opacity: 1; transform: translate(-50%, 0); }
}
@keyframes floatBob {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-8px); }
}
@keyframes pulseDot {
  0%, 100% { opacity: 1; transform: scale(1); box-shadow: 0 0 0 0 currentColor; }
  50%      { opacity: 0.6; transform: scale(1.3); box-shadow: 0 0 0 4px transparent; }
}
@keyframes glowPulse {
  0%, 100% {
    box-shadow:
      0 8px 32px rgba(0, 0, 0, 0.12),
      inset 0 1px 1px rgba(255, 255, 255, 0.15),
      0 0 0 0 color-mix(in srgb, var(--accent) 45%, transparent);
  }
  50% {
    box-shadow:
      0 8px 32px rgba(0, 0, 0, 0.12),
      inset 0 1px 1px rgba(255, 255, 255, 0.15),
      0 0 24px 6px color-mix(in srgb, var(--accent) 45%, transparent);
  }
}
@keyframes checkDraw {
  to { stroke-dashoffset: 0; }
}
@keyframes loaderFadeOut {
  to { opacity: 0; visibility: hidden; }
}

.archive-banner {
  position: relative;
  width: 100%;
  padding: 12px 48px;
  background: #b91c1c;
  color: #ffffff;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  font-size: 0.9rem;
  font-weight: 700;
  text-align: center;
  border-bottom: 2px solid #7f1d1d;
  box-shadow: 0 2px 10px rgba(185, 28, 28, 0.25);
  max-height: 60px;
  overflow: hidden;
  opacity: 1;
  transition: max-height 0.3s ease, opacity 0.25s ease, padding 0.3s ease, border-width 0.3s ease;
  z-index: 200;
  animation: dropIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
}
.archive-banner.collapsed {
  max-height: 0;
  padding-top: 0;
  padding-bottom: 0;
  opacity: 0;
  border-bottom-width: 0;
  box-shadow: none;
}
.archive-icon {
  font-size: 1.15rem;
  line-height: 1;
}
.archive-close {
  position: absolute;
  right: 14px;
  top: 50%;
  transform: translateY(-50%);
  width: 26px;
  height: 26px;
  border: none;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.15);
  color: #ffffff;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.95rem;
  line-height: 1;
  transition: background 0.2s ease;
  flex-shrink: 0;
}
.archive-close:hover {
  background: rgba(255, 255, 255, 0.28);
}
@media (max-width: 520px) {
  .archive-banner {
    font-size: 0.8rem;
    padding: 11px 40px;
  }
  .archive-icon {
    font-size: 1rem;
  }
  .archive-close {
    right: 10px;
    width: 24px;
    height: 24px;
  }
}

.bg-video, .bg-image {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: -1;
}

.sidebar {
  position: fixed;
  left: 24px;
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 12px 8px;
  background: var(--nav-bg);
  border: 1px solid var(--nav-border);
  border-radius: 999px;
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
  z-index: 99;
  animation: slideInLeft 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) 0.15s both;
}

.sidebar-btn {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  border: none;
  background: transparent;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-muted);
  transition: all 0.2s ease;
  text-decoration: none;
}
.sidebar-btn:hover {
  background: rgba(255, 255, 255, 0.15);
  color: var(--text);
  transform: scale(1.08);
}
[data-theme="dark"] .sidebar-btn:hover {
  background: rgba(255, 255, 255, 0.1);
}
.sidebar-btn:active { transform: scale(0.94); }
.sidebar-btn svg { width: 19px; height: 19px; }

.sidebar-divider {
  width: 22px;
  height: 1px;
  background: var(--glass-border);
  margin: 4px 0;
  flex-shrink: 0;
}

@media (max-width: 760px) {
  .sidebar {
    left: 50%;
    top: auto;
    bottom: 24px;
    transform: translateX(-50%);
    flex-direction: row;
    animation: slideInLeftMobile 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) 0.15s both;
  }
  .sidebar-divider {
    width: 1px;
    height: 22px;
    margin: 0 4px;
  }
}

.topbar {
  position: fixed;
  top: 24px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 6px;
  background: var(--nav-bg);
  border: 1px solid var(--nav-border);
  border-radius: 999px;
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
  z-index: 99;
  animation: dropInCentered 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.05s both;
}

.topbar-link {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 9px 18px;
  border-radius: 999px;
  font-size: 0.85rem;
  font-weight: 600;
  text-decoration: none;
  color: var(--text-muted);
  background: transparent;
  transition: all 0.2s ease;
  white-space: nowrap;
}
.topbar-link:hover {
  color: var(--text);
  background: rgba(255, 255, 255, 0.1);
}
[data-theme="dark"] .topbar-link:hover {
  background: rgba(255, 255, 255, 0.06);
}
.topbar-link.active {
  color: #0a0d13;
  background: var(--accent);
}
.topbar-link.active:hover {
  background: var(--accent-light);
}
.topbar-link svg { width: 15px; height: 15px; flex-shrink: 0; }

@media (max-width: 520px) {
  .topbar-link span.label { display: none; }
  .topbar-link { padding: 10px; }
  .topbar-link svg { width: 17px; height: 17px; }
}

.page-wrap {
  flex: 1;
  display: flex;
}
.container {
  max-width: 980px;
  margin: 0 auto;
  padding: 120px 24px 160px;
  width: 100%;
}
@media (min-width: 761px) {
  .container { padding-left: 100px; }
}

#view {
  display: flex;
  flex-direction: column;
  gap: 24px;
  transition: opacity 0.16s ease, transform 0.16s ease;
}
#view.route-exit { opacity: 0; transform: translateY(6px); }
#view.route-enter { opacity: 0; transform: translateY(6px); }

.page-header h1 {
  font-size: clamp(1.6rem, 4.5vw, 2.2rem);
  font-weight: 800;
  letter-spacing: -0.03em;
  margin-bottom: 6px;
}
.page-header p {
  font-size: 0.95rem;
  color: var(--text-muted);
}

.resume-wrap {
  background: var(--glass);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border: 1px solid var(--glass-border);
  border-radius: 28px;
  padding: 48px 52px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
}
@media (max-width: 560px) {
  .resume-wrap { padding: 32px 24px; }
}

.resume-content h1 {
  font-size: 1.8rem;
  font-weight: 800;
  letter-spacing: -0.03em;
  margin-bottom: 4px;
}
.resume-content h2 {
  font-size: 0.8rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--accent);
  margin: 28px 0 10px;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--glass-border);
}
.resume-content h3 {
  font-size: 0.97rem;
  font-weight: 700;
  margin: 16px 0 2px;
}
.resume-content h4 {
  font-size: 0.85rem;
  font-weight: 500;
  color: var(--text-muted);
  margin-bottom: 6px;
}
.resume-content p {
  font-size: 0.9rem;
  color: var(--text-muted);
  line-height: 1.7;
  margin-bottom: 8px;
}
.resume-content ul {
  list-style: none;
  padding: 0;
  margin: 4px 0 12px;
}
.resume-content ul li {
  font-size: 0.875rem;
  color: var(--text-muted);
  padding: 3px 0 3px 18px;
  position: relative;
  line-height: 1.6;
}
.resume-content ul li::before {
  content: '–';
  position: absolute;
  left: 0;
  color: var(--accent);
  font-weight: 700;
}
.resume-content a {
  color: var(--accent);
  text-decoration: none;
  font-weight: 500;
}
.resume-content a:hover { text-decoration: underline; }
.resume-content strong { color: var(--text); font-weight: 600; }
.resume-content em { color: var(--text-dim); font-style: normal; font-size: 0.82rem; }
.resume-content code {
  font-family: 'SF Mono', 'Fira Code', monospace;
  font-size: 0.82rem;
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid var(--glass-border);
  padding: 2px 8px;
  border-radius: 6px;
  color: var(--accent);
}
.resume-content hr {
  border: none;
  border-top: 1px solid var(--glass-border);
  margin: 20px 0;
}
.resume-content > p:first-of-type {
  font-size: 0.82rem;
  color: var(--text-dim);
  margin-bottom: 4px;
}

.state-box {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 64px 24px;
  text-align: center;
}
.state-box .icon { font-size: 2rem; }
.state-box p { font-size: 0.9rem; color: var(--text-muted); }
.spinner {
  width: 28px;
  height: 28px;
  border: 2px solid var(--glass-border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.resume-footer {
  padding: 16px 20px;
  background: rgba(255, 255, 255, 0.06);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--glass-border);
  border-radius: 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}
.resume-footer .footer-left {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.8rem;
  color: var(--text-muted);
}
.resume-footer .footer-left strong { color: var(--text); font-weight: 600; }
.footer-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--text-dim);
  flex-shrink: 0;
}
.footer-note {
  font-size: 0.78rem;
  color: var(--text-dim);
  font-style: italic;
}
@media (max-width: 560px) {
  .resume-footer { flex-direction: column; align-items: flex-start; gap: 6px; }
}

.reveal {
  opacity: 0;
  transform: translateY(28px) scale(0.94);
  transition: opacity 0.55s ease, transform 0.65s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.reveal.visible {
  opacity: 1;
  transform: translateY(0) scale(1);
}

.hero-band {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 32px;
  padding: 48px 40px;
  background: var(--glass);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border: 1px solid var(--glass-border);
  border-radius: 28px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
}
.hero-text h1 {
  font-size: clamp(1.8rem, 5vw, 2.5rem);
  font-weight: 800;
  letter-spacing: -0.03em;
  line-height: 1.1;
  margin-bottom: 12px;
}
.hero-text p {
  font-size: 1rem;
  color: var(--text-muted);
  max-width: 420px;
  line-height: 1.6;
}
.hero-status {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-top: 18px;
  padding: 6px 14px;
  border-radius: 999px;
  font-size: 0.8rem;
  font-weight: 600;
  border: 1px solid color-mix(in srgb, var(--green) 40%, transparent);
  background: color-mix(in srgb, var(--green) 12%, transparent);
  color: var(--green);
}
.hero-status .dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--green);
  color: var(--green);
  animation: pulseDot 1.8s ease-in-out infinite;
}
.hero-avatar {
  flex-shrink: 0;
  width: 88px;
  height: 88px;
  border-radius: 18px;
  overflow: hidden;
  border: 2px solid var(--glass-border);
  background: rgba(255, 255, 255, 0.08);
  animation: floatBob 4.5s ease-in-out infinite;
}
.hero-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }

@media (max-width: 560px) {
  .hero-band { flex-direction: column-reverse; padding: 32px; }
  .hero-avatar { width: 68px; height: 68px; }
}

.bento-grid {
  position: relative;
  --bento-row: 130px;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  grid-auto-rows: var(--bento-row);
  gap: 20px;
}

.bento-spotlight {
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.4s ease;
  background: radial-gradient(
    480px circle at var(--sx, 50%) var(--sy, 50%),
    rgba(255, 255, 255, 0.08),
    transparent 70%
  );
}
.bento-grid:hover .bento-spotlight { opacity: 1; }

.tile {
  position: relative;
  z-index: 1;
  background: var(--glass);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border: 1px solid var(--glass-border);
  border-radius: 24px;
  box-shadow:
    0 8px 32px rgba(0, 0, 0, 0.12),
    inset 0 1px 1px rgba(255, 255, 255, 0.15);
  transition: transform 0.15s ease, box-shadow 0.25s ease;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  overflow: hidden;
  padding: 20px;
  will-change: transform;
}
.tile:hover {
  transform: translateY(-5px) scale(1.015);
  box-shadow:
    0 14px 40px rgba(0, 0, 0, 0.18),
    inset 0 1px 1px rgba(255, 255, 255, 0.15);
}

.tile::before {
  content: '';
  position: absolute;
  inset: 0;
  z-index: 0;
  opacity: 0;
  transition: opacity 0.2s ease;
  background: radial-gradient(
    160px circle at var(--gx, 50%) var(--gy, 50%),
    rgba(255, 255, 255, 0.18),
    transparent 70%
  );
  pointer-events: none;
}
.tile:hover::before { opacity: 1; }

.tile::after {
  content: '';
  position: absolute;
  top: 0;
  left: -150%;
  width: 60%;
  height: 100%;
  background: linear-gradient(120deg, transparent, rgba(255, 255, 255, 0.25), transparent);
  transform: skewX(-20deg);
  transition: left 0.65s ease;
  z-index: 0;
  pointer-events: none;
}
.tile:hover::after { left: 150%; }

.tile > * { position: relative; z-index: 1; }

.tile-value {
  font-size: 1.9rem;
  font-weight: 800;
  letter-spacing: -0.03em;
  line-height: 1;
  margin-bottom: 6px;
  font-variant-numeric: tabular-nums;
}
.tile-value .suffix { font-size: 1.2rem; font-weight: 700; color: var(--accent); }
.tile-label {
  font-size: 0.78rem;
  color: var(--text-muted);
  font-weight: 500;
  line-height: 1.3;
}
.stat-note { color: var(--accent); }

.tile-work {
  flex-direction: row;
  align-items: center;
  justify-content: flex-start;
  text-align: right;
  gap: 16px;
  padding: 20px 26px;
}
.tile-work-icon {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  overflow: hidden;
  flex-shrink: 0;
  border: 1.5px solid var(--glass-border);
  background: rgba(255, 255, 255, 0.08);
}
.tile-work-icon img { width: 100%; height: 100%; object-fit: cover; display: block; }
.tile-work-info { flex: 1; min-width: 0; }
.tile-work-role { font-size: 0.93rem; font-weight: 700; }
.tile-work-company { font-size: 0.82rem; color: var(--text-muted); margin: 2px 0 4px; }
.tile-work-date { font-size: 0.75rem; color: var(--text-dim); }

@media (max-width: 560px) {
  .tile-work { text-align: left; }
}

.tile-contact {
  flex-direction: row;
  justify-content: space-between;
  text-align: left;
  padding: 28px 36px;
  transition-delay: 0.35s;
  animation: glowPulse 3.5s ease-in-out 1.2s infinite;
}
.tile-contact h2 {
  font-size: 1.4rem;
  font-weight: 800;
  letter-spacing: -0.02em;
  margin-bottom: 4px;
}
.tile-contact p { font-size: 0.9rem; color: var(--text-muted); }
.tile-contact-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 12px 22px;
  border-radius: 12px;
  background: var(--accent);
  color: #0a0d13;
  font-weight: 700;
  font-size: 0.88rem;
  text-decoration: none;
  flex-shrink: 0;
  transition: background 0.2s ease, transform 0.2s ease;
}
.tile-contact-btn:hover { background: var(--accent-light); transform: translateY(-2px); }
.tile-contact-btn svg { width: 16px; height: 16px; }

@media (max-width: 560px) {
  .tile-contact { flex-direction: column; text-align: center; gap: 16px; }
}

.tile-1x1 { grid-column: span 1; grid-row: span 1; }
.tile-1x2 { grid-column: span 1; grid-row: span 2; }
.tile-1x3 { grid-column: span 1; grid-row: span 3; }
.tile-2x1 { grid-column: span 2; grid-row: span 1; }
.tile-2x2 { grid-column: span 2; grid-row: span 2; }
.tile-3x1 { grid-column: span 3; grid-row: span 1; }
.tile-4x1 { grid-column: span 4; grid-row: span 1; }

.tile-group {
  grid-column: 1 / -1;
  grid-row: span 2;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  grid-auto-rows: var(--bento-row);
  gap: 20px;
}
.tile-group > .tg-stat-1 { grid-column: 1; grid-row: 1; transition-delay: 0.05s; }
.tile-group > .tg-stat-2 { grid-column: 2; grid-row: 1; transition-delay: 0.1s; }
.tile-group > .tg-stat-3 { grid-column: 1; grid-row: 2; transition-delay: 0.15s; }
.tile-group > .tg-stat-4 { grid-column: 2; grid-row: 2; transition-delay: 0.2s; }
.tile-group > .tg-work-1 { grid-column: 3 / span 2; grid-row: 1; transition-delay: 0.25s; }
.tile-group > .tg-work-2 { grid-column: 3 / span 2; grid-row: 2; transition-delay: 0.3s; }

@media (max-width: 900px) {
  .tile-group { grid-template-columns: repeat(2, 1fr); grid-row: span 4; }
  .tile-group > .tg-stat-1 { grid-column: 1; grid-row: 1; }
  .tile-group > .tg-stat-2 { grid-column: 2; grid-row: 1; }
  .tile-group > .tg-stat-3 { grid-column: 1; grid-row: 2; }
  .tile-group > .tg-stat-4 { grid-column: 2; grid-row: 2; }
  .tile-group > .tg-work-1 { grid-column: 1 / span 2; grid-row: 3; }
  .tile-group > .tg-work-2 { grid-column: 1 / span 2; grid-row: 4; }
}
@media (max-width: 560px) {
  .tile-group { grid-template-columns: 1fr; grid-row: span 6; }
  .tile-group > * { grid-column: 1 !important; }
  .tile-group > .tg-stat-1 { grid-row: 1; }
  .tile-group > .tg-stat-2 { grid-row: 2; }
  .tile-group > .tg-stat-3 { grid-row: 3; }
  .tile-group > .tg-stat-4 { grid-row: 4; }
  .tile-group > .tg-work-1 { grid-row: 5; }
  .tile-group > .tg-work-2 { grid-row: 6; }
}

@media (max-width: 900px) {
  .bento-grid { grid-template-columns: repeat(2, 1fr); }
  .tile-4x1, .tile-3x1 { grid-column: span 2; }
}
@media (max-width: 560px) {
  .bento-grid { grid-template-columns: 1fr; }
  .tile-2x2, .tile-2x1, .tile-3x1, .tile-4x1 { grid-column: span 1; }

<script>

(function IntroLoaderModule() {
  const loader = document.getElementById('introLoader');
  if (!loader) return;

  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reducedMotion) {
    loader.remove();
    return;
  }

  function finish() {
    loader.classList.add('hide');
    setTimeout(() => loader.remove(), 550);
  }

  if (document.readyState === 'complete') {
    setTimeout(finish, 900);
  } else {
    window.addEventListener('load', () => setTimeout(finish, 900));
  }
})();

(function ArchiveBannerModule() {
  const banner = document.getElementById('archiveBanner');
  const closeBtn = document.getElementById('archiveClose');
  if (!banner || !closeBtn) return;

  if (sessionStorage.getItem('bannerDismissed') === 'true') {
    banner.classList.add('collapsed');
  }

  closeBtn.addEventListener('click', () => {
    banner.classList.add('collapsed');
    sessionStorage.setItem('bannerDismissed', 'true');
  });
})();

(function BackgroundMediaModule() {
  const backgroundMedia = document.getElementById('backgroundMedia');
  const muteBtn = document.getElementById('videoMuteBtn');
  const iconVolume = document.getElementById('iconVolume');
  const iconVolumeMuted = document.getElementById('iconVolumeMuted');
  if (!backgroundMedia || !muteBtn) return;

  const BACKGROUND_PNG = '/resources/background.png';
  const BACKGROUND_MP4 = '/resources/background.mp4';

  let backgroundVideo = null;

  function tryBackgroundPng() {
    return new Promise((resolve) => {
      const image = new Image();
      image.onload = () => {
        image.className = 'bg-image';
        image.alt = '';
        image.setAttribute('aria-hidden', 'true');
        resolve(image);
      };
      image.onerror = () => resolve(null);
      image.src = BACKGROUND_PNG;
    });
  }

  function tryBackgroundMp4() {
    return new Promise((resolve) => {
      const video = document.createElement('video');
      const source = document.createElement('source');

      video.id = 'bgVideo';
      video.className = 'bg-video';
      video.muted = true;
      video.autoplay = true;
      video.loop = true;
      video.playsInline = true;
      video.preload = 'auto';

      video.addEventListener('loadeddata', () => resolve(video), { once: true });
      video.addEventListener('error', () => resolve(null), { once: true });

      source.src = BACKGROUND_MP4;
      source.type = 'video/mp4';
      video.appendChild(source);
      video.load();
    });
  }

  function updateVolumeIcon() {
    if (!backgroundVideo) return;
    if (backgroundVideo.muted) {
      iconVolume.style.display = 'none';
      iconVolumeMuted.style.display = 'block';
      muteBtn.setAttribute('title', 'Unmute video');
      muteBtn.setAttribute('aria-label', 'Unmute video');
    } else {
      iconVolume.style.display = 'block';
      iconVolumeMuted.style.display = 'none';
      muteBtn.setAttribute('title', 'Mute video');
      muteBtn.setAttribute('aria-label', 'Mute video');
    }
  }

  function loadSavedVideoMuteState() {
    if (!backgroundVideo) return;
    backgroundVideo.muted = true;
    updateVolumeIcon();
  }

  async function initializeBackground() {
    const pngPromise = tryBackgroundPng();
    const mp4Promise = tryBackgroundMp4();

    const image = await pngPromise;
    if (image) {
      backgroundMedia.appendChild(image);
      muteBtn.style.display = 'none';
      return;
    }

    const video = await mp4Promise;
    if (video) {
      backgroundVideo = video;
      backgroundMedia.appendChild(video);
      video.play().catch(() => {});
      muteBtn.style.display = 'flex';
      loadSavedVideoMuteState();
      return;
    }

    muteBtn.style.display = 'none';
  }

  muteBtn.addEventListener('click', () => {
    if (!backgroundVideo) return;
    backgroundVideo.muted = !backgroundVideo.muted;
    localStorage.setItem('videoMuted', String(backgroundVideo.muted));
    updateVolumeIcon();
  });

  initializeBackground();
})();

(function ThemeModule() {
  const root   = document.documentElement;
  const toggle = document.getElementById('themeToggle');
  const sun    = document.getElementById('iconSun');
  const moon   = document.getElementById('iconMoon');
  if (!toggle || !sun || !moon) return;

  function applyTheme(t) {
    root.dataset.theme = t;
    sun.style.display  = t === 'dark'  ? 'block' : 'none';
    moon.style.display = t === 'light' ? 'block' : 'none';
  }

  const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const saved = localStorage.getItem('theme') || (systemDark ? 'dark' : 'light');
  applyTheme(saved);

  toggle.addEventListener('click', (e) => {
    const next = root.dataset.theme === 'dark' ? 'light' : 'dark';
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    if (!document.startViewTransition || reducedMotion) {
      applyTheme(next);
      localStorage.setItem('theme', next);
      return;
    }

    const x = e.clientX;
    const y = e.clientY;
    const endRadius = Math.hypot(
      Math.max(x, window.innerWidth - x),
      Math.max(y, window.innerHeight - y)
    );

    const transition = document.startViewTransition(() => {
      applyTheme(next);
      localStorage.setItem('theme', next);
    });

    transition.ready.then(() => {
      document.documentElement.animate(
        {
          clipPath: [
            `circle(0px at ${x}px ${y}px)`,
            `circle(${endRadius}px at ${x}px ${y}px)`
          ]
        },
        {
          duration: 550,
          easing: 'ease-in-out',
          pseudoElement: '::view-transition-new(root)'
        }
      );
    });
  });
})();

(function TopbarModule() {
  const topbar = document.getElementById('topbar');
  if (!topbar) return;

  const links = Array.from(topbar.querySelectorAll('.topbar-link'));

  function currentRoute() {
    const hash = window.location.hash.replace(/^#/, '');
    return hash === '' ? '/' : hash;
  }

  function updateActive() {
    const route = currentRoute();
    links.forEach(link => {
      link.classList.toggle('active', link.dataset.route === route);
    });
  }

  window.addEventListener('hashchange', updateActive);
  updateActive();
})();

function initScrollReveal() {
  const targets = document.querySelectorAll('.reveal');
  if (!targets.length) return;

  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('visible');
        entry.target.querySelectorAll('.count').forEach(el => {
          if (window.startCount) window.startCount(el);
        });
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.15 });

  targets.forEach(el => observer.observe(el));
}

(function CountingAnimationModule() {
  function startCount(el) {
    const target = parseInt(el.dataset.target, 10);
    const suffix = el.dataset.suffix || '';
    const duration = 1200;
    const startTime = performance.now();

    function easeOut(t) { return 1 - (1 - t) * (1 - t); }

    function tick(now) {
      const elapsed = now - startTime;
      const progress = Math.min(elapsed / duration, 1);
      const value = Math.round(easeOut(progress) * target);
      el.textContent = value;
      if (suffix) {
        el.innerHTML = value + '<span class="suffix">' + suffix + '</span>';
      }
      if (progress < 1) requestAnimationFrame(tick);
    }

    requestAnimationFrame(tick);
  }

  window.startCount = startCount;
})();

function initBentoInteractions() {
  const grid = document.getElementById('bentoGrid');
  const spotlight = document.getElementById('bentoSpotlight');
  if (!grid) return;

  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reducedMotion) return;

  if (spotlight) {
    grid.addEventListener('mousemove', (e) => {
      const rect = grid.getBoundingClientRect();
      const x = ((e.clientX - rect.left) / rect.width) * 100;
      const y = ((e.clientY - rect.top) / rect.height) * 100;
      grid.style.setProperty('--sx', x + '%');
      grid.style.setProperty('--sy', y + '%');
    });
  }
}

function updateExperienceSafely() {
  const container = document.getElementById('experienceCounter');
  if (!container) return;

  const startDate = new Date(container.getAttribute('data-start'));
  const currentDate = new Date();
  let totalMonths = (currentDate.getFullYear() - startDate.getFullYear()) * 12;
  totalMonths += currentDate.getMonth() - startDate.getMonth();

  if (currentDate.getDate() < startDate.getDate()) {
    totalMonths--;
  }
  if (totalMonths < 0) totalMonths = 0;
  const years = Math.floor(totalMonths / 12);
  const months = totalMonths % 12;
  const ySpan = container.querySelector('.y-val');
  const mSpan = container.querySelector('.m-val');

  if (ySpan) ySpan.textContent = years;
  if (mSpan) mSpan.textContent = months;
}

let cachedConfig = null;
let configPromise = null;

function resolveColor(c) {
  const palette = ['accent', 'accent-light', 'accent-dark', 'red', 'brown', 'green', 'blue', 'purple', 'dark-grey'];
  return palette.includes(c) ? 'var(--' + c + ')' : c;
}

function applyGlobalConfig(config) {
  const links = config.socialLinks || {};
  document.querySelectorAll('a[title="Discord"]').forEach(a => {
    if (links.discord) a.href = links.discord;
  });
  document.querySelectorAll('a[title="GitHub"]').forEach(a => {
    if (links.github) a.href = links.github;
  });
}

function fetchConfig() {
  if (configPromise) return configPromise;
  configPromise = fetch('/config.json')
    .then(res => {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    })
    .then(config => {
      cachedConfig = config;
      applyGlobalConfig(config);
      return config;
    })
    .catch(err => {
      console.warn('config.json not loaded, using fallback content:', err.message);
      return null;
    });
  return configPromise;
}

function populateHome(config) {
  if (!config) return;

  const p = config.personal || {};
  const heroTitle = document.getElementById('heroTitle');
  const heroTagline = document.getElementById('heroTagline');
  const heroStatus = document.getElementById('heroStatus');
  const heroStatusText = document.getElementById('heroStatusText');
  const heroAvatarImg = document.getElementById('heroAvatarImg');

  if (heroTitle && p.name) heroTitle.textContent = "Hi, I'm " + p.name;
  if (heroTagline && p.tagline) heroTagline.textContent = p.tagline;
  if (heroAvatarImg && p.avatar) heroAvatarImg.src = p.avatar;

  if (heroStatus && heroStatusText && p.workStatus) {
    const statusMap = {
      1: { text: 'Looking for Work', color: 'var(--green)' },
      2: { text: 'Commissions Open', color: 'var(--green)' },
      3: { text: 'Not Looking for Work', color: 'var(--red)' }
    };
    const s = statusMap[p.workStatus] || statusMap[1];
    heroStatusText.textContent = s.text;
    heroStatus.style.color = s.color;
    heroStatus.style.borderColor = 'color-mix(in srgb, ' + s.color + ' 40%, transparent)';
    heroStatus.style.background = 'color-mix(in srgb, ' + s.color + ' 12%, transparent)';
    heroStatus.dot.style.background = 'color-mix(in srgb, ' + s.color;
    heroStatus.dot.style.color = 'color-mix(in srgb, ' + s.color;
  }

  const experienceCounter = document.getElementById('experienceCounter');
  if (experienceCounter && p.qaStartDate) {
    experienceCounter.setAttribute('data-start', p.qaStartDate);
    updateExperienceSafely();
  }

  const stats = config.stats || {};

  function applyStat(valueId, noteId, statData) {
    if (!statData) return;
    const valueEl = document.getElementById(valueId);
    const noteEl = document.getElementById(noteId);

    if (valueEl) {
      if (typeof statData.value !== 'undefined') valueEl.dataset.target = statData.value;
      if (typeof statData.suffix !== 'undefined') valueEl.dataset.suffix = statData.suffix;
      if (statData.color) valueEl.style.color = resolveColor(statData.color);
    }
    if (noteEl && typeof statData.note !== 'undefined') {
      noteEl.textContent = statData.note ? ' — ' + statData.note : '';
    }
  }

  applyStat('statBugs', 'statBugsNote', stats.bugsReported);
  applyStat('statTesting', 'statTestingNote', stats.testingTime);
  applyStat('statCompanies', 'statCompaniesNote', stats.companies);

  const work = config.workExperience || [];
  function applyWork(index, iconId, roleId, companyId, dateId) {
    const entry = work[index];
    if (!entry) return;
    const iconEl = document.getElementById(iconId);
    const roleEl = document.getElementById(roleId);
    const companyEl = document.getElementById(companyId);
    const dateEl = document.getElementById(dateId);
    if (iconEl && entry.icon) { iconEl.src = entry.icon; iconEl.alt = entry.company || ''; }
    if (roleEl && entry.role) roleEl.textContent = entry.role;
    if (companyEl && entry.company) companyEl.textContent = entry.company;
    if (dateEl && entry.dateRange) dateEl.innerHTML = '<span style="color:var(--accent)">' + entry.dateRange + '</span>';
  }
  applyWork(0, 'work1Icon', 'work1Role', 'work1Company', 'work1Date');
  applyWork(1, 'work2Icon', 'work2Role', 'work2Company', 'work2Date');

  const contactMessage = document.getElementById('contactMessage');
  if (contactMessage && p.contactMessage) contactMessage.textContent = p.contactMessage;

  const links = config.socialLinks || {};
  const contactBtn = document.getElementById('contactBtn');
  if (contactBtn && links.discord) contactBtn.href = links.discord;
}

function initResumeContent() {
  const contentEl = document.getElementById('resumeContent');
  if (!contentEl) return;

  const RESUME_LAST_UPDATED = 'August 2026';
  const lastUpdatedEl = document.getElementById('lastUpdated');
  if (lastUpdatedEl) lastUpdatedEl.textContent = RESUME_LAST_UPDATED;

  fetch('/resume.md')
    .then(res => {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.text();
    })
    .then(md => {
      marked.setOptions({ breaks: true, gfm: true });
      contentEl.innerHTML = marked.parse(md);
    })
    .catch(err => {
      contentEl.innerHTML =
        '<div class="state-box">' +
        '<span class="icon">📄</span>' +
        '<p>Couldn\'t load <code>resume.md</code>.</p>' +
        '<p style="font-size:0.78rem;color:var(--text-dim)">' + err.message + '</p>' +
        '</div>';
    });
}

(function RouterModule() {
  const view = document.getElementById('view');
  if (!view) return;

  const routeMap = { '/': 'route-home', '/resume': 'route-resume', '/about': 'route-about' };

  function currentRoute() {
    const hash = window.location.hash.replace(/^#/, '');
    return routeMap[hash] ? hash : '/';
  }

  function afterRender(path) {
    initScrollReveal();
    initBentoInteractions();
    if (path === '/') {
      updateExperienceSafely();
      fetchConfig().then(cfg => populateHome(cfg));
    } else if (path === '/resume') {
      initResumeContent();
    }
  }

  function swap(path) {
    const template = document.getElementById(routeMap[path]);
    if (!template) return;
    view.innerHTML = '';
    view.appendChild(template.content.cloneNode(true));
    afterRender(path);
  }

  function render(path) {
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    if (reducedMotion) {
      swap(path);
      return;
    }

    view.classList.add('route-exit');
    setTimeout(() => {
      swap(path);
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          view.classList.remove('route-exit');
          view.classList.remove('route-enter');
        });
      });
    }, 160);
  }

  window.addEventListener('hashchange', () => render(currentRoute()));
  render(currentRoute());
})();

setInterval(updateExperienceSafely, 86400000);

</script>
